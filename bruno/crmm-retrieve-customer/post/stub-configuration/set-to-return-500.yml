info:
  name: set-to-return-500
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/test-only/post-signup/config"
  body:
    type: json
    data: |-
      {
        "subscriptionId": "{{subscriptionId}}",
        "getSubscriptionAndPostRetrieveCustomerId": {
          "api": "PostRetrieveCustomerId",
          "getSubscription": {
            "utr": "{{utr}}",
            "crn": "{{crn}}",
            "name": "Test Company LTD PLC",
            "contacts": [
              {
                "name": "Firstname Lastname",
                "email": "firstname.lastname@example.com",
                "language": "en-GB",
                "status": "valid"
              }
            ]
          },
          "status": 500,
          "defaultBodyOverride": {{payload}}
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const payload = JSON.stringify(`{
          "origin": "HIP",
          "response": {
            "failures": [
              {
                "type": "type of failure",
                "reason": "reason for failure"
              }
            ]
          }
        }`);

        bru.setVar("payload", payload);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
