info:
  name: (400) no-correlation-id
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/compliance/civil-investigation-and-avoidance/api/customer/v1/retrievecustomer"
  headers:
    - name: Authorization
      value: Basic {{base64Password}}
    - name: correlationid
      value: not a uuid
  body:
    type: json
    data: |-
      {
        "companyRegistrationNumber": "{{crn}}",
        "uniqueTaxReference": "{{utr}}"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
