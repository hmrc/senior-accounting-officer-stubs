info:
  name: set-to-return-500
  type: http
  seq: 10

http:
  method: POST
  url: "{{baseUrl}}/test-only/signup/config"
  body:
    type: json
    data: |-
      {
        "utr": "{{utr}}",
        "postEtmpSubscription": {
          "status": 500,
          "defaultBodyOverride" : {{payload}}
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const payload = JSON.stringify(`{
          "origin": "HoD",
          "response": {
            "error": {
              "code": "500",
              "message": "string",
              "logID": "89505FF7D91484D27D33CC1E5E208807"
            }
          }
        }`);

        bru.setVar("payload", payload);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
