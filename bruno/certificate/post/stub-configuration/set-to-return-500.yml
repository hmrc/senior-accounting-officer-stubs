info:
  name: set-to-return-500
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/test-only/post-signup/config"
  headers:
    - name: Authorization
      value: Basic {{base64Password}}
  body:
    type: json
    data: |-
      {
        "subscriptionId": "{{subscriptionId}}",
        "postCertificate": {
          "status": 500,
          "defaultBodyOverride": "{\"origin\":\"HIP\",\"response\":{\"failures\":[{\"type\":\"INTERNAL_SERVER_ERROR\",\"reason\":\"Internal server error\"}]}}"
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
