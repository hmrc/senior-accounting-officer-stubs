info:
  name: set-to-return-201 successfull request
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/test-only/post-signup/config"
  headers:
    - name: Authorization
      value: Basic {{base64Password}}
  body:
    type: json
    data: |-
      {
        "subscriptionId": "{{subscriptionId}}",
        "postNotification": {
          "status": 201
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
