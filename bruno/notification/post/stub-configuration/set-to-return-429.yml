info:
  name: set-to-return-429
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/test-only/post-signup/config"
  headers:
    - name: Authorization
      value: Basic {{base64Password}}
  body:
    type: json
    data: |-
      {
        "subscriptionId": "{{subscriptionId}}",
        "postNotification": {
          "status": 429,
          "defaultBodyOverride": "{\"origin\":\"HIP\",\"response\":{\"failures\":[{\"type\":\"INTERNAL_SERVER_ERROR\",\"reason\":\"Internal server error\"}]}}"
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
