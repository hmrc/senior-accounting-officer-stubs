info:
  name: Post Etmp Subscription (201)
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/etmp/RESTAdapter/dsao/subscription"
  headers:
    - name: Authorization
      value: Basic {{base64Password}}
    - name: X-Transmitting-System
      value: HIP
    - name: X-Originating-System
      value: MDTP
    - name: correlationId
      value: "{{$randomUUID}}"
    - name: X-Receipt-Date
      value: "{{receiptDate}}"
  body:
    type: json
    data: |-
      {
        "idType": "UTR",
        "idNumber": "{{utr}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        bru.setVar("receiptDate", new Date().toISOString().replace(/\.\d{3}Z$/, "Z"));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
